name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Strip and package
        run: |
          strip target/x86_64-unknown-linux-musl/release/seasalt
          tar czf seasalt-x86_64-unknown-linux-musl.tar.gz \
            -C target/x86_64-unknown-linux-musl/release seasalt
          sha256sum seasalt-x86_64-unknown-linux-musl.tar.gz > sha256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            seasalt-x86_64-unknown-linux-musl.tar.gz
            sha256SUMS
