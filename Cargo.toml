[package]
name = "seasalt"
version = "0.1.2"
edition = "2021"
description = "fish-style inline autosuggestion and per-directory history for bash"
license = "MIT OR Apache-2.0"
repository = "https://github.com/miyakogi/seasalt"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "suggest"
harness = false
