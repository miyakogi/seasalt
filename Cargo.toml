[package]
name = "seasalt"
version = "0.1.0"
edition = "2021"
description = "fish-style inline autosuggestion and per-directory history for bash"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "suggest"
harness = false
